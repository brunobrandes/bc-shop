# Runtime secrets are stored in Google Cloud Secret Manager and resolved by
# Firebase App Hosting. No secret values belong in this file.
runConfig:
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: ATLAS_API_KEY
    secret: ATLAS_API_KEY
    availability:
      - RUNTIME
  - variable: ATLAS_CAMPAIGN_ID
    secret: ATLAS_CAMPAIGN_ID
    availability:
      - RUNTIME
  - variable: ATLAS_BASE_URL
    value: https://api.youratlas.com/v1/api
    availability:
      - RUNTIME
  - variable: BC_AGENT_API_KEY
    secret: BC_AGENT_API_KEY
    availability:
      - RUNTIME
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability:
      - RUNTIME
  - variable: BC_ADMIN_API_KEY
    secret: BC_ADMIN_API_KEY
    availability:
      - RUNTIME
  - variable: CALL_INSIGHTS_API_BASE_URL
    secret: CALL_INSIGHTS_API_BASE_URL
    availability:
      - RUNTIME
  # Firebase web config is public after bundling, but values remain
  # environment-specific and are injected during the App Hosting build.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
