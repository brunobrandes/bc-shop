name: Deploy BC-Shop Functions

on:
  push:
    branches: [main]
    paths:
      - "apps/functions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter functions typecheck
      - run: pnpm --filter functions build

      - name: Create Function artifact
        run: |
          mkdir -p "$RUNNER_TEMP/functions-package"
          cp apps/functions/host.json "$RUNNER_TEMP/functions-package/"
          cp apps/functions/package.json "$RUNNER_TEMP/functions-package/"
          cp -R apps/functions/dist "$RUNNER_TEMP/functions-package/dist"
          pnpm --dir "$RUNNER_TEMP/functions-package" install --prod --no-lockfile

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: ${{ runner.temp }}/functions-package
