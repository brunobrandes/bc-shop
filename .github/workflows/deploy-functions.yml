name: Deploy BC-Shop Functions

on:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/functions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-functions:
    name: Validate Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter functions typecheck
      - run: pnpm --filter functions test

  build-functions:
    name: Build Functions
    needs: validate-functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter functions build

      - name: Create Function artifact
        run: |
          pnpm --config.node-linker=hoisted --filter functions deploy --prod --legacy "$RUNNER_TEMP/functions-package"
          test -f "$RUNNER_TEMP/functions-package/host.json"
          test -f "$RUNNER_TEMP/functions-package/dist/src/functions/atlas-call-completed.js"
          test -f "$RUNNER_TEMP/functions-package/node_modules/@azure/functions/package.json"
          test ! -L "$RUNNER_TEMP/functions-package/node_modules/@azure/functions"
          tar -czf "$RUNNER_TEMP/functions-deploy.tar.gz" -C "$RUNNER_TEMP/functions-package" .

      - name: Upload Functions artifact
        uses: actions/upload-artifact@v7
        with:
          name: functions-deploy
          path: ${{ runner.temp }}/functions-deploy.tar.gz
          if-no-files-found: error

  deploy-functions:
    name: Deploy Functions
    needs: build-functions
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download Functions artifact
        uses: actions/download-artifact@v7
        with:
          name: functions-deploy
          path: artifact

      - name: Extract Functions artifact
        run: |
          mkdir -p functions-deploy
          tar -xzf artifact/functions-deploy.tar.gz -C functions-deploy

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          package: functions-deploy

      - name: Verify Function registration
        shell: bash
        run: |
          for attempt in {1..12}; do
            function_name="$(az functionapp function list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AZURE_FUNCTION_APP_NAME }}" \
              --query "[?contains(name, '/atlas-call-completed')].name | [0]" \
              --output tsv)"

            if [[ -n "$function_name" ]]; then
              echo "Function registration verified."
              exit 0
            fi

            echo "Waiting for Function registration (attempt $attempt/12)..."
            sleep 10
          done

          echo "Function atlas-call-completed was not registered after deployment."
          exit 1
