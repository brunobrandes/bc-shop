name: Deploy All

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bc-shop-poc-deploy
  cancel-in-progress: false

jobs:
  deploy-infra:
    name: Deploy Infrastructure
    uses: ./.github/workflows/deploy-infra.yml
    permissions:
      id-token: write
      contents: read
    secrets: inherit

  deploy-functions:
    name: Deploy Functions
    needs: deploy-infra
    uses: ./.github/workflows/deploy-functions.yml
    permissions:
      id-token: write
      contents: read

  smoke-tests:
    name: Smoke Tests
    needs: deploy-functions
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Check web health
        if: ${{ vars.WEB_BASE_URL != '' }}
        env:
          WEB_BASE_URL: ${{ vars.WEB_BASE_URL }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 12 \
            --retry-delay 10 \
            --retry-all-errors \
            --max-time 20 \
            "${WEB_BASE_URL%/}/api/health" \
            >/dev/null

      - name: Check Function App state
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
        run: |
          function_status="$(az resource show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --resource-type Microsoft.Web/sites \
            --name "$AZURE_FUNCTION_APP_NAME" \
            --api-version 2024-04-01 \
            --query '[properties.state, properties.availabilityState, properties.runtimeAvailabilityState] | join(`|`, @)' \
            --output tsv)"

          if [[ "$function_status" != "Running|Normal|Normal" ]]; then
            echo "Function App is not healthy (state|availability|runtime: $function_status)." >&2
            exit 1
          fi
