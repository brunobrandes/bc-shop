name: Deploy Azure infrastructure

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-infra:
    name: Validate Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep --stdout >/dev/null

  deploy-infra:
    name: Deploy Infrastructure
    needs: validate-infra
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Azure login with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure deployment
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_CAMPAIGN_ID_PT: ${{ secrets.ATLAS_CAMPAIGN_ID_PT }}
          ATLAS_CAMPAIGN_ID_EN: ${{ secrets.ATLAS_CAMPAIGN_ID_EN }}
          BC_AGENT_API_KEY: ${{ secrets.BC_AGENT_API_KEY }}
          ATLAS_WEBHOOK_SECRET: ${{ secrets.ATLAS_WEBHOOK_SECRET }}
        run: |
          az deployment sub validate \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              resourceGroupName="$AZURE_RESOURCE_GROUP" \
              webAppName="$AZURE_WEB_APP_NAME" \
              functionAppName="$AZURE_FUNCTION_APP_NAME" \
              atlasApiKey="$ATLAS_API_KEY" \
              atlasCampaignIdPt="$ATLAS_CAMPAIGN_ID_PT" \
              atlasCampaignIdEn="$ATLAS_CAMPAIGN_ID_EN" \
              bcAgentApiKey="$BC_AGENT_API_KEY" \
              atlasWebhookSecret="$ATLAS_WEBHOOK_SECRET" \
            --only-show-errors \
            --output none

      - name: Deploy infrastructure
        env:
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
          AZURE_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          ATLAS_API_KEY: ${{ secrets.ATLAS_API_KEY }}
          ATLAS_CAMPAIGN_ID_PT: ${{ secrets.ATLAS_CAMPAIGN_ID_PT }}
          ATLAS_CAMPAIGN_ID_EN: ${{ secrets.ATLAS_CAMPAIGN_ID_EN }}
          BC_AGENT_API_KEY: ${{ secrets.BC_AGENT_API_KEY }}
          ATLAS_WEBHOOK_SECRET: ${{ secrets.ATLAS_WEBHOOK_SECRET }}
        run: |
          az deployment sub create \
            --name "bc-shop-${GITHUB_RUN_ID}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters \
              location="$AZURE_LOCATION" \
              resourceGroupName="$AZURE_RESOURCE_GROUP" \
              webAppName="$AZURE_WEB_APP_NAME" \
              functionAppName="$AZURE_FUNCTION_APP_NAME" \
              atlasApiKey="$ATLAS_API_KEY" \
              atlasCampaignIdPt="$ATLAS_CAMPAIGN_ID_PT" \
              atlasCampaignIdEn="$ATLAS_CAMPAIGN_ID_EN" \
              bcAgentApiKey="$BC_AGENT_API_KEY" \
              atlasWebhookSecret="$ATLAS_WEBHOOK_SECRET" \
            --only-show-errors \
            --output none
